name: Publish to VS Code Marketplace

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish extension
        if: env.VSCE_PAT != ''
        run: |
          npx vsce publish --pat "$VSCE_PAT"

      - name: Skip Marketplace publish without PAT
        if: env.VSCE_PAT == ''
        run: echo "VSCE_PAT is not configured; upload the VSIX manually from the Marketplace publisher page."
