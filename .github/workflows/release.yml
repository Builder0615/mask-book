name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package version $EXPECTED_TAG"
            exit 1
          fi

      - name: Build VSIX
        run: npm run package

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" mask-book-*.vsix \
            --title "mask-book $RELEASE_TAG" \
            --generate-notes
